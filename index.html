<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Squiggle</title>
<meta name="description" content="A party game for a video call: everyone holds part of a sequence of shapes nobody can describe.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
</head>
<body>

<canvas class="confetti" id="confetti" hidden></canvas>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>Big Squiggle</h1>
    </div>

    <div class="topright">
      <div class="ricon" id="restrictIcon" hidden></div>
      <div class="clock" id="clock" hidden></div>

      <button class="doorbtn" id="doorBtn" hidden aria-label="Leave room" title="Leave room">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M10 3H5.5A1.5 1.5 0 0 0 4 4.5v15A1.5 1.5 0 0 0 5.5 21H10"/>
          <path d="M16 8.5l3.5 3.5L16 15.5"/>
          <path d="M9 12h10.5"/>
        </svg>
      </button>

      <div class="leaveask" id="leaveAsk" hidden>
        <span>Leave?</span>
        <button class="yes" id="leaveYes" aria-label="Yes, leave">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
        </button>
        <button class="no" id="leaveNo" aria-label="Stay">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="gapnotice" id="roundGap" hidden>
    <span id="gapText"></span>
    <div class="btnrow">
      <button class="btn ghost" id="gapLobby">Back to lobby</button>
      <button class="btn ghost" id="gapLeave">Leave</button>
    </div>
  </div>

  <!-- ================= HOME ================= -->
  <section id="homeView" hidden>
    <div class="home">
      <div class="intro">
        <p class="lede">A communication puzzle game for 2&ndash;8 players.</p>
        <p class="sub">Play over a video call app like Zoom <b>with chat disabled</b>, and do not use any other external forms of communication.</p>
      </div>

      <div class="steps">
        <div class="step" id="stepName">
          <span class="num">1</span>
          <div class="stepbody">
            <label for="nameInput">Your name</label>
            <input type="text" id="nameInput" maxlength="24" autocomplete="nickname" spellcheck="false">
          </div>
        </div>

        <div class="step" id="stepRoom">
          <span class="num">2</span>
          <div class="stepbody">
            <button class="btn primary wide" id="createBtn" disabled>Create a room</button>

            <div class="rule"><span>or</span></div>

            <div class="codewrap">
              <input type="text" id="joinCode" maxlength="12" placeholder="CODE" spellcheck="false" autocomplete="off" aria-label="Game code">
              <button class="btn" id="joinBtn" disabled>Join</button>
            </div>
          </div>
        </div>
      </div>

      <p class="err" id="homeErr" hidden></p>
      <p class="hint" id="connecting">Connecting…</p>
    </div>
  </section>

  <!-- ================= LOBBY ================= -->
  <section id="lobbyView" hidden>
    <button class="roomcode" id="roomCode" title="Copy invite link"></button>

    <div class="roster" id="roster"></div>

    <div class="btnrow" id="lobbyControls">
      <button class="btn" id="readyBtn">Ready?</button>
      <button class="btn primary" id="startBtn" hidden>Start</button>
    </div>

    <p class="hint" id="lobbyHint" hidden></p>
    <p class="hint" id="waiting" hidden>Round in progress.</p>

    <div class="btnrow">
      <button class="btn ghost" id="resumeBtn" hidden>End round</button>
    </div>
  </section>

  <!-- ================= BRIEFING ================= -->
  <section id="briefView" hidden>
    <div class="brief">
      <div class="ricon big" id="briefIcon"></div>
      <h2 class="btitle" id="briefTitle"></h2>
      <p class="bdesc" id="briefDesc"></p>
      <button class="btn primary wide" id="briefReadyBtn">Ready</button>
      <div class="pips" id="briefPips"></div>
    </div>
  </section>

  <!-- ================= PLAY ================= -->
  <section id="playView" hidden>
    <div class="slots" id="slots"></div>

    <div class="plate"><div class="grid" id="glyphGrid"></div></div>

    <div class="holdrow" id="holdRow">
      <div class="pips" id="holdPips"></div>
      <button class="holdpill" id="holdBtn" aria-label="Hold to check the sequence">
        <span class="fill" id="holdFill"></span>
        <svg class="tick" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"
             stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12.5l5.5 5.5L20 7"/></svg>
      </button>
    </div>

    <!-- last in the flow, so a verdict appearing can never move the board above it -->
    <div id="verdictSlot"></div>
  </section>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
