<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Big Squiggle</title>
<meta name="description" content="A party game for a video call: everyone holds part of a sequence of shapes nobody can describe.">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Mono:wght@400;500&family=Public+Sans:wght@400;500;600&display=swap">
</head>
<body>

<canvas class="confetti" id="confetti" hidden></canvas>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <h1>Big Squiggle</h1>
      <p id="tagline">Everyone holds part of a sequence of shapes that nobody can easily describe, and all of you have to enter the whole thing.</p>
    </div>
    <div class="roomtag" id="roomTag" hidden></div>
  </header>

  <!-- ================= HOME ================= -->
  <section id="homeView" hidden>
    <div class="home">
      <div class="field">
        <label for="nameInput">Name</label>
        <input type="text" id="nameInput" maxlength="24" autocomplete="nickname" spellcheck="false">
      </div>

      <button class="btn primary wide" id="createBtn">Create</button>

      <div class="rule"><span>or</span></div>

      <div class="codewrap">
        <input type="text" id="joinCode" maxlength="12" placeholder="CODE" spellcheck="false" autocomplete="off" aria-label="Game code">
        <button class="btn" id="joinBtn">Join</button>
      </div>

      <p class="err" id="homeErr" hidden></p>
      <p class="hint" id="connecting" hidden>Connecting…</p>
    </div>
  </section>

  <!-- ================= LOBBY ================= -->
  <section id="lobbyView" hidden>
    <button class="roomcode" id="roomCode" title="Copy invite link"></button>

    <div class="roster" id="roster"></div>

    <div class="btnrow" id="lobbyControls">
      <button class="btn" id="readyBtn">Ready?</button>
      <button class="btn primary" id="startBtn" hidden>Start</button>
    </div>

    <p class="hint" id="lobbyHint" hidden></p>
    <p class="hint" id="waiting" hidden>Round in progress.</p>

    <div class="btnrow">
      <button class="btn ghost" id="resumeBtn" hidden>End round</button>
      <button class="btn ghost" id="leaveRoomBtn">Leave</button>
    </div>

    <p class="houserule-min">No chat or outside communication.</p>
  </section>

  <!-- ================= BRIEFING ================= -->
  <section id="briefView" hidden>
    <div class="brief">
      <div class="ricon big" id="briefIcon"></div>
      <h2 class="btitle" id="briefTitle"></h2>
      <p class="bdesc" id="briefDesc"></p>
      <button class="btn primary wide" id="briefReadyBtn">Ready</button>
      <div class="pips" id="briefPips"></div>
    </div>
  </section>

  <!-- ================= PLAY ================= -->
  <section id="playView" hidden>
    <div class="restrictbar">
      <div class="ricon" id="restrictIcon"></div>
    </div>

    <div class="slots" id="slots"></div>

    <div class="plate"><div class="grid" id="glyphGrid"></div></div>

    <!-- last in the flow, so a verdict appearing can never move the board above it -->
    <div id="verdictSlot"></div>
  </section>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
