name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # `firebase init hosting:github` writes the first name; the second is for a key added
  # by hand. Until one exists the deploy step skips itself and the build stays green.
  FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BIG_SQUIGGLE || secrets.FIREBASE_SERVICE_ACCOUNT }}

# the preview deploy comments its link on the PR and reports a check
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # the browser test plays a table of two against the emulator, which needs a JVM
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npx playwright install --with-deps chromium

      - run: npm run test:e2e:emulator

      - name: Deploy to Firebase Hosting
        if: ${{ github.ref == 'refs/heads/main' && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: big-squiggle

      # a PR from a fork gets no secrets, so only this repo's own branches get a preview
      - name: Deploy a preview channel
        if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && env.FIREBASE_SERVICE_ACCOUNT != '' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          projectId: big-squiggle
